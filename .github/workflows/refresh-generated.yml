name: Refresh generated content

on:
  push:
    branches:
      - fix/typing-guide-content-v2
    paths:
      - 'scripts/diversify-phrases.ts'
      - 'scripts/generate-content.ts'
      - '.github/workflows/refresh-generated.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typing-guide-content-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/content/generated/content.json; then
            echo "Generated catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/generated/content.json
          git commit -m "Regenerate diversified 5000 phrase catalog"
          git push origin HEAD:fix/typing-guide-content-v2
