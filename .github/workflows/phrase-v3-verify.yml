name: Phrase v3 Verify

on:
  push:
    branches:
      - phrase-world-quality-v3

permissions:
  contents: write

jobs:
  verify-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Print human-review phrase samples
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('src/content/generated/content.json', 'utf8'));
          const districtNames = [
            'はじまり通り', 'おいしい市場', 'どうぶつ広場', 'ゲーム横丁',
            'みどりの森', 'サイエンスラボ', 'はたらく駅前', 'オフィス街',
            'シティデザイン区', 'フューチャーポート', 'マスター中枢'
          ];
          for (const districtName of districtNames) {
            const district = catalog.districts.find((d) => d.name === districtName);
            const missions = catalog.missions.filter((m) => m.districtId === district.id).sort((a,b) => a.number-b.number);
            const chosen = [missions[0], missions[4], missions[9]].filter(Boolean);
            console.log(`\n=== ${districtName} ===`);
            for (const mission of chosen) {
              console.log(`-- ${mission.id} / LEVEL ${mission.level} / ${mission.title} --`);
              const rows = catalog.phrases.filter((p) => p.missionId === mission.id).sort((a,b) => a.order-b.order).slice(0, 6);
              for (const row of rows) console.log(`${row.order}. ${row.text}`);
            }
          }
          const oldBad = catalog.phrases.filter((p) => p.text.includes('鍵と机を比べる'));
          console.log(`\nOLD_BAD_PHRASE_COUNT=${oldBad.length}`);
          NODE
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run deploy:dry
      - run: npm run smoke
      - name: Commit refreshed content artifact
        run: |
          if git diff --quiet -- src/content/generated/content.json; then
            echo "Generated content already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/generated/content.json
          git commit -m "Refresh natural world phrases"
          git push
