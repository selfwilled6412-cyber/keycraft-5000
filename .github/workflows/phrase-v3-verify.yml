name: Phrase v3 Verify

on:
  push:
    branches:
      - phrase-world-quality-v3

permissions:
  contents: write

jobs:
  verify-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run deploy:dry
      - run: npm run smoke
      - name: Commit refreshed content artifact
        run: |
          if git diff --quiet -- src/content/generated/content.json; then
            echo "Generated content already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/generated/content.json
          git commit -m "Refresh natural world phrases"
          git push
