name: Import KEY CRAFT 5000 handoff

on:
  push:
    paths:
      - 'keycraft-5000-online-handoff*.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify handoff ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name 'keycraft-5000-online-handoff*.zip' | head -n 1)"
          test -n "$archive"
          actual="$(sha256sum "$archive" | awk '{print toupper($1)}')"
          expected="3C4ECABC19BB2542A612F750EBC5BBF2D3B715A2104F3D4243A061D83FDC5F70"
          test "$actual" = "$expected"

      - name: Extract handoff safely
        shell: python
        run: |
          import glob
          import shutil
          import zipfile
          from pathlib import Path

          matches = sorted(glob.glob("keycraft-5000-online-handoff*.zip"))
          if not matches:
              raise RuntimeError("Handoff ZIP not found")
          archive = Path(matches[0])
          root = Path.cwd().resolve()

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  if not name or name.endswith("/"):
                      continue
                  target = (root / name).resolve()
                  if root not in target.parents and target != root:
                      raise RuntimeError(f"Unsafe ZIP path: {name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst)

      - name: Remove one-time handoff files
        shell: bash
        run: |
          rm -f keycraft-5000-online-handoff*.zip
          rm -f .github/workflows/import-handoff.yml

      - name: Commit imported MVP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import KEY CRAFT 5000 MVP"
          git push origin main
