name: One-shot SAI COIN integration agent

on:
  push:
    branches: [agent/sai-coin-integration-v1]
    paths: ['.sai-coin-integration-trigger']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/sai-coin-integration-v1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply SAI COIN integration patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/one-shot-sai-coin-integration.py
          rm -f .github/workflows/one-shot-sai-coin-integration.yml .sai-coin-integration-trigger
          git diff --check
          npm ci
          npm run check

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: connect mission completions to SAI COIN'
          git push origin HEAD:agent/sai-coin-integration-v1
