name: Production E2E - Yuuki

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prod-e2e-yuuki.yml
      - scripts/prod-e2e-yuuki.mjs

permissions:
  contents: read

jobs:
  verify-production-world:
    if: github.head_ref == 'e2e-yuuki-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete Yuuki world through production API and verify D1 state
        run: node scripts/prod-e2e-yuuki.mjs
